
services:
  db:
    image: postgres:16-alpine
    container_name: bharat-one-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bharatone
      POSTGRES_USER: bharat
      POSTGRES_PASSWORD: bharat_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharat -d bharatone"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: bharat-one-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://bharat:bharat_dev_password@db:5432/bharatone
      ADMIN_API_KEY: "change-this-admin-key"
      CORS_ORIGINS: http://localhost:8081
      JOB_MONITOR_ENABLED: "true"
      JOB_MONITOR_INTERVAL_SECONDS: 900
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8001
    container_name: bharat-one-web
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres_data:
